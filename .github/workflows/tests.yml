name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit tests never load the Kronos model or call Upstox, so only
      # the light dependencies are installed here.
      - run: pip install pandas numpy scipy pytz pyyaml python-dotenv requests pytest
      - run: python -m compileall -q src dashboard run_backtest.py run_backtest_now.py
      - run: python -m pytest tests -q
